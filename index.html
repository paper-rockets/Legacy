<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wanderlust</title>
  <style>
    :root {
      color-scheme: light;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 11.5px;
      color: #000000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    /* ── Touch Controls & Boost ────────────────────────────────────────── */
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #joystick-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 55%;
      height: 100%;
      pointer-events: none;
      touch-action: none;
    }

    #joystick-base {
      position: absolute;
      left: max(65px, calc(14% + env(safe-area-inset-left)));
      bottom: max(65px, calc(16% + env(safe-area-inset-bottom)));
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    body.is-touch-device #joystick-base.resting {
      opacity: 0.45;
    }

    #joystick-base.active {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.12);
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #boost-btn {
      position: absolute;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      touch-action: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      text-transform: uppercase;
    }

    #boost-btn.active, #boost-btn:active {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.5);
      color: #ffffff;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud-root"></div>
  <div id="settings-root"></div>
  <div id="editor-root"></div>
  <div id="blueprint-root"></div>
  <!-- Touch Controls: Dynamic Left-Hand Joystick & Translucent Boost -->
  <div id="touch-controls">
    <div id="joystick-zone"></div>
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="boost-btn">BOOST</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
