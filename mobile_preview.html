<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Device Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* Top Navigation Bar */
        .simulator-nav {
            flex-shrink: 0;
            background: #161b22;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 100;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #ffffff;
        }
        .segmented-group {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }
        .segmented-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .segmented-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        .segmented-btn.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-link-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #c9d1d9;
            font-family: inherit;
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .nav-link-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }
        /* Viewport Canvas Stage */
        .stage {
            flex: 1;
            width: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at center, #1b2230 0%, #0d1117 100%);
        }
        .device-wrapper {
            position: relative;
            background: #000000;
            border: 6px solid #2d333b;
            border-radius: 36px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: width 0.25s ease, height 0.25s ease, transform 0.25s ease;
            transform-origin: center center;
        }
        .device-screen {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #62b1e8;
        }
        .device-info-badge {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
    <header class="simulator-nav">
        <div class="nav-left">
            <span class="nav-title">Device View</span>

            <!-- Device Selector -->
            <div class="segmented-group" id="device-selector">
                <button class="segmented-btn active" onclick="setDevice('iphone')">iPhone (15/16 Pro)</button>
                <button class="segmented-btn" onclick="setDevice('s25')">Galaxy S25 Ultra</button>
                <button class="segmented-btn" onclick="setDevice('tab_s6')">Galaxy Tab S6 Lite</button>
            </div>

            <!-- Orientation Selector -->
            <div class="segmented-group" id="orientation-selector">
                <button class="segmented-btn active" id="btn-portrait" onclick="setOrientation('portrait')">Portrait</button>
                <button class="segmented-btn" id="btn-landscape" onclick="setOrientation('landscape')">Landscape</button>
            </div>

            <!-- Zoom / Scale Selector -->
            <div class="segmented-group" id="scale-selector">
                <button class="segmented-btn active" id="scale-fit" onclick="setScale('fit')">Auto Fit</button>
                <button class="segmented-btn" id="scale-100" onclick="setScale('100')">100%</button>
                <button class="segmented-btn" id="scale-75" onclick="setScale('75')">75%</button>
                <button class="segmented-btn" id="scale-50" onclick="setScale('50')">50%</button>
            </div>
        </div>

        <div class="nav-right">
            <button class="nav-link-btn" onclick="reloadFrame()">Reload</button>
            <a class="nav-link-btn" href="/" target="_blank">Full Window</a>
            <a class="nav-link-btn" href="http://192.168.0.22:8080" target="_blank">Wi-Fi (192.168.0.22:8080)</a>
        </div>
    </header>

    <main class="stage" id="stage">
        <div class="device-wrapper" id="device-wrapper">
            <iframe id="device-frame" class="device-screen" src="/"></iframe>
            <div class="device-info-badge" id="device-badge">iPhone (15/16 Pro) — 393 x 852</div>
        </div>
    </main>

    <script>
        const DEVICES = {
            iphone: {
                name: 'iPhone (15/16 Pro)',
                portrait: { w: 393, h: 852 },
                landscape: { w: 852, h: 393 },
                radius: '42px'
            },
            s25: {
                name: 'Samsung Galaxy S25 Ultra',
                portrait: { w: 412, h: 919 },
                landscape: { w: 919, h: 412 },
                radius: '28px'
            },
            tab_s6: {
                name: 'Samsung Galaxy Tab S6 Lite',
                portrait: { w: 800, h: 1280 },
                landscape: { w: 1280, h: 800 },
                radius: '24px'
            }
        };

        let currentDeviceId = 'iphone';
        let currentOrientation = 'portrait';
        let currentScaleMode = 'fit';

        const wrapper = document.getElementById('device-wrapper');
        const frame = document.getElementById('device-frame');
        const badge = document.getElementById('device-badge');
        const stage = document.getElementById('stage');

        function updateDisplay() {
            const dev = DEVICES[currentDeviceId];
            const dims = dev[currentOrientation];

            wrapper.style.width = dims.w + 'px';
            wrapper.style.height = dims.h + 'px';
            wrapper.style.borderRadius = dev.radius;

            // Apply scale
            applyScale(dims.w, dims.h);

            badge.textContent = `${dev.name} (${currentOrientation.toUpperCase()}) — ${dims.w} x ${dims.h}`;

            // Sync Device buttons
            document.querySelectorAll('#device-selector .segmented-btn').forEach((btn, idx) => {
                const keys = ['iphone', 's25', 'tab_s6'];
                btn.classList.toggle('active', keys[idx] === currentDeviceId);
            });

            // Sync Orientation buttons
            document.getElementById('btn-portrait').classList.toggle('active', currentOrientation === 'portrait');
            document.getElementById('btn-landscape').classList.toggle('active', currentOrientation === 'landscape');
        }

        function applyScale(w, h) {
            if (currentScaleMode === 'fit') {
                const stageW = stage.clientWidth - 48;
                const stageH = stage.clientHeight - 48;
                const scaleW = stageW / w;
                const scaleH = stageH / h;
                const scale = Math.min(1.0, scaleW, scaleH);
                wrapper.style.transform = `scale(${scale})`;
            } else if (currentScaleMode === '100') {
                wrapper.style.transform = 'scale(1.0)';
            } else if (currentScaleMode === '75') {
                wrapper.style.transform = 'scale(0.75)';
            } else if (currentScaleMode === '50') {
                wrapper.style.transform = 'scale(0.50)';
            }

            document.querySelectorAll('#scale-selector .segmented-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === 'scale-' + currentScaleMode);
            });
        }

        function setDevice(devId) {
            currentDeviceId = devId;
            updateDisplay();
        }

        function setOrientation(ori) {
            currentOrientation = ori;
            updateDisplay();
        }

        function setScale(mode) {
            currentScaleMode = mode;
            const dims = DEVICES[currentDeviceId][currentOrientation];
            applyScale(dims.w, dims.h);
        }

        function reloadFrame() {
            frame.src = frame.src;
        }

        window.addEventListener('resize', () => {
            if (currentScaleMode === 'fit') {
                const dims = DEVICES[currentDeviceId][currentOrientation];
                applyScale(dims.w, dims.h);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
